[project]
name = "enterprise-chat-api"
version = "1.0.0"
description = "Enterprise Chat API for Dify"
requires-python = ">=3.12.0"

dependencies = [
    # FastAPI and server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.11",

    # Pydantic and settings
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "PyJWT>=2.8.0",

    # Flask ecosystem
    "flask>=3.0.0",
    "flask-login>=0.6.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-cors>=6.0.0",

    # HTTP client
    "httpx[socks]>=0.28.0",

    # AWS SDK
    "boto3>=1.42.88",

    # Celery and task queue
    "celery>=5.6.3",
    "redis[hiredis]>=7.4.0",

    # Utilities
    "pytz>=2024.0",
    "pyyaml>=6.0.0",
    "pycryptodome>=3.20.0",
    "packaging>=24.0",

    # OpenTelemetry
    "opentelemetry-distro>=0.62b0,<1.0.0",
    "opentelemetry-instrumentation-flask>=0.62b0,<1.0.0",
    "opentelemetry-instrumentation-httpx>=0.62b0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.62b0,<1.0.0",

    # Logging
    "bleach>=6.3.0",
    "gevent>=26.4.0",
    "gevent-websocket>=0.10.1",

    # JSON handling
    "orjson>=3.0.0",

    # Dify dependencies from main api
    "croniter>=6.2.2",
    "gmpy2>=2.3.0",
    "google-api-python-client>=2.194.0",
    "gunicorn>=25.3.0",
    "psycogreen>=1.0.2",
    "python-socketio>=5.13.0",
    "sendgrid>=6.12.5",
    "sseclient-py>=1.8.0",
    "flask-compress>=1.24,<2.0.0",
    "flask-migrate>=4.1.0,<5.0.0",
    "flask-orjson>=2.0.0,<3.0.0",
    "flask-restx>=1.3.2,<2.0.0",
    "langfuse>=4.2.0,<5.0.0",
    "langsmith>=0.7.31,<1.0.0",
    "mlflow-skinny>=3.11.1,<4.0.0",
    "opentelemetry-instrumentation-celery>=0.62b0,<1.0.0",
    "opentelemetry-instrumentation-redis>=0.62b0,<1.0.0",
    "opentelemetry-propagator-b3>=1.41.0,<2.0.0",
    "readabilipy>=0.3.0,<1.0.0",
    "resend>=2.27.0,<3.0.0",
    "weave>=0.52.36,<1.0.0",
    "arize-phoenix-otel~=0.15.0",
    "graphon~=0.1.2",
    "httpx-sse~=0.4.0",
    "json-repair~=0.59.2",
    "opik~=1.11.2",
    "deprecated>=1.2.0",

    # Document processing
    "markdown>=3.4.0",
    "jinja2>=3.1.0",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",

    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",

    # File processing
    "pillow>=10.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "chardet>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]